<div class="row 1">
    {% for item in menu %}
    <div class="nails" style="width: 100%; margin-bottom: 30px; text-align: center;">
        <div class="info">
            <h3> {{ item.title }}</h3>
            <p>{{ item.description }}</p>
            <span>{{ item.price }} руб.</span>
        </div>
    </div>
    {% endfor %}
</div>
